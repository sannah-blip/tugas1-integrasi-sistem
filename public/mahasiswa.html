<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Data Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            padding: 30px 0;
        }
        .table-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }
        .table thead th {
            background: #0d6efd;
            color: white;
            border: none;
            font-weight: 600;
            padding: 15px;
        }
        .table tbody td {
            padding: 15px;
            vertical-align: middle;
        }
        .table tbody tr:hover {
            background: #f8f9fa;
        }
        .refresh-btn {
            float: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Data Mahasiswa (Real-Time)</h2>
                <div>
                    <button class="btn btn-primary refresh-btn" onclick="loadData()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                    <button class="btn btn-success me-2" onclick="autoRefresh()">
                        Auto Refresh: <span id="autoStatus">OFF</span>
                    </button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th width="5%">ID</th>
                            <th width="20%">Nama</th>
                            <th width="30%">Alamat</th>
                            <th width="10%">IPK</th>
                            <th width="10%">Semester</th>
                            <th width="25%">Hobi</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr>
                            <td colspan="6" class="text-center">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let autoRefreshActive = false;

        async function loadData() {
            try {
                const response = await fetch('/api/mahasiswa');
                const result = await response.json();
                if (result.success && result.data) {
                    renderTable(result.data);
                } else {
                    document.getElementById('tbody').innerHTML = 
                        '<tr><td colspan="6" class="text-center text-danger">Gagal memuat data</td></tr>';
                }
            } catch (error) {
                document.getElementById('tbody').innerHTML = 
                    '<tr><td colspan="6" class="text-center text-danger">Error: ' + error.message + '</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tbody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Tidak ada data mahasiswa</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(mhs => `
                <tr>
                    <td><strong>${mhs.id}</strong></td>
                    <td>${escapeHtml(mhs.nama)}</td>
                    <td>${escapeHtml(mhs.alamat)}</td>
                    <td><span class="badge bg-primary">${mhs.ipk}</span></td>
                    <td>${mhs.semester}</td>
                    <td>${escapeHtml(mhs.hobi)}</td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function autoRefresh() {
            if (autoRefreshActive) {
                clearInterval(autoRefreshInterval);
                autoRefreshActive = false;
                document.getElementById('autoStatus').textContent = 'OFF';
                document.getElementById('autoStatus').classList.remove('text-success');
            } else {
                loadData();
                autoRefreshInterval = setInterval(loadData, 1000);
                autoRefreshActive = true;
                document.getElementById('autoStatus').textContent = 'ON (1s)';
                document.getElementById('autoStatus').classList.add('text-success');
            }
        }

        loadData();
    </script>
</body>
</html>
